server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /srv/progetti/hotel-os/frontend/dist;
    index index.html;

    # File dell'app con hash nel nome (cambiano nome a ogni build): cache lunga, mai ricontrollati.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html (e fallback SPA): sempre ricontrollato col server, altrimenti il browser tiene
    # la copia vecchia e continua a caricare il bundle precedente anche dopo `npm run build`.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
